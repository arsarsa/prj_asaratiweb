<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>asarati.it | Accedi al Backend</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #18212f; background: #f5f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    h1 { font-size: clamp(1.65rem, 4vw, 2rem); line-height: 1.2; margin: 0 0 12px; letter-spacing: -.025em; }
    h2 { font-size: 1.15rem; margin: 0 0 10px; }
    p { line-height: 1.6; }
    a { color: #1d4ed8; text-underline-offset: 3px; }
    a:hover { color: #1e40af; }
    button, input { font: inherit; }
    button { min-height: 44px; padding: 11px 16px; border: 1px solid #cbd3df; border-radius: 9px; background: #fff; color: #18212f; cursor: pointer; font-weight: 600; }
    button:hover { background: #f0f4f9; }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid #bfd8ff; outline-offset: 3px; }
    .primary-button { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
    .primary-button:hover { background: #1e40af; }
    .card { background: #fff; border: 1px solid #e1e6ee; border-radius: 14px; box-shadow: 0 3px 12px rgb(20 36 60 / 4%); }
    .eyebrow { color: #1d4ed8; font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin: 0 0 16px; }
    .muted { color: #586578; }
    .page-header { margin-bottom: 26px; }
    .page-header p { margin: 0; }
    .brand { font-size: 1.1rem; font-weight: 700; letter-spacing: -.025em; color: #273448; }
    .brand span { color: #1d4ed8; }
    .footer { color: #64748b; font-size: .85rem; margin: 24px 0 0; }

    .login-shell { width: min(100%, 480px); margin: 0 auto; padding: 48px 20px 36px; }
    .login-shell > .brand { margin: 0 0 32px; }
    .login-card { padding: 32px; }
    h1 { color: #1d4ed8; }
    #user-email:empty { display: none; }
    #user-email { font-size: .9rem; overflow-wrap: anywhere; }
    form { display: grid; gap: 18px; margin-top: 26px; }
    .field { display: grid; gap: 8px; }
    label { font-size: .9rem; font-weight: 600; color: #273448; }
    input { width: 100%; min-height: 46px; padding: 11px 12px; border: 1px solid #cbd3df; border-radius: 9px; background: #fff; color: #18212f; }
    input::placeholder { color: #7c8798; }
    .divider { display: flex; align-items: center; gap: 14px; color: #7c8798; font-size: .8rem; margin: 24px 0; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e1e6ee; }
    #google-login { width: 100%; }
    .password-control { position: relative; }
    .password-control input { padding-right: 90px; }
    .password-toggle { position: absolute; right: 4px; top: 2px; min-height: 42px; border: 0; background: transparent; color: #1d4ed8; padding: 8px 12px; font-size: .85rem; }
    .reset-button { padding: 8px 0; min-height: 44px; background: transparent; border: 0; color: #1d4ed8; font-size: .9rem; text-decoration: underline; text-underline-offset: 3px; }
    #reset-message { font-size: .9rem; line-height: 1.5; color: #166534; margin: 12px 0 0; }
    #reset-message:empty { display: none; }
    #reset-message[data-error="true"] { color: #a52222; }
    button:disabled { opacity: .65; cursor: wait; }
    .signup { margin: 24px 0 0; text-align: center; font-size: .9rem; }
    #error-message { color: #a52222; background: #fff4f4; border-radius: 9px; padding: 12px; margin: 20px 0 0; font-size: .9rem; overflow-wrap: anywhere; }
    #error-message:empty { display: none; }
    @media (max-width: 480px) { .login-shell { padding: 24px 16px; } .login-shell > .brand { margin-bottom: 24px; } .login-card { padding: 24px 20px; } }
  </style>
</head>
<body>
  <main class="login-shell">
    <p class="brand">asarati<span>.it</span></p>
    <section class="card login-card" aria-labelledby="login-title">
      <header class="page-header">
        <p class="eyebrow">Area di gestione</p>
        <h1 id="login-title">Accedi</h1>
        <p class="muted">Entra nel pannello per gestire prodotti, file e QR code.</p>
      </header>
      <h2 id="user-email"></h2>
      <form id="login-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="nome@esempio.it" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <div class="password-control">
            <input type="password" id="login-password" placeholder="La tua password" autocomplete="current-password" required>
            <button id="toggle-password" class="password-toggle" type="button" aria-controls="login-password" aria-pressed="false" aria-label="Mostra password">Mostra</button>
          </div>
        </div>
        <button class="primary-button" type="submit">Accedi</button>
      </form>
      <button id="reset-password" class="reset-button" type="button">Password dimenticata?</button>
      <p id="reset-message" role="status" aria-live="polite"></p>
      <div class="divider" aria-hidden="true">oppure</div>
      <button id="google-login" type="button">Accedi con Google</button>
      <p id="error-message" role="alert" aria-live="polite"></p>
      <p class="signup muted">Non hai un account? <a href="/uploadfile/signup.html">Registrati</a></p>
    </section>
    <p class="footer">Asarati · Gestione dei contenuti editoriali</p>
  </main>
    <script type="module">
        import { login, loginWithGoogle, resetPassword } from "./scripts/login_upload.js?v=20261019-reset2";

        document.addEventListener("DOMContentLoaded", () => {
            console.log("✅ Pagina di login caricata!");

            const loginForm = document.getElementById("login-form");
            if (loginForm) {
                loginForm.addEventListener("submit", (e) => {
                    e.preventDefault();
                    const emailInput = document.getElementById("login-email");
                    const passwordInput = document.getElementById("login-password");

                    if (!emailInput || !passwordInput) {
                        console.error("❌ Errore: Input email o password mancanti!");
                        return;
                    }

                    const email = emailInput.value.trim();
                    const password = passwordInput.value;

                    if (email === "" || password === "") {
                        document.getElementById("error-message").textContent = "⚠️ Inserisci email e password.";
                        return;
                    }

                    console.log("📌 Tentativo di login con:", email);
                    login(email, password).catch(error => {
                        document.getElementById("error-message").textContent = `Errore: ${error.message}`;
                    });
                });
            } else {
                console.error("❌ Errore: Form di login NON trovato!");
            }

            document.getElementById("toggle-password").addEventListener("click", () => {
                const input = document.getElementById("login-password");
                const button = document.getElementById("toggle-password");
                const visible = input.type === "password";
                input.type = visible ? "text" : "password";
                button.textContent = visible ? "Nascondi" : "Mostra";
                button.setAttribute("aria-pressed", String(visible));
                button.setAttribute("aria-label", visible ? "Nascondi password" : "Mostra password");
            });

            document.getElementById("reset-password").addEventListener("click", async () => {
                const emailInput = document.getElementById("login-email");
                if (!emailInput.reportValidity()) return;
                const button = document.getElementById("reset-password");
                const message = document.getElementById("reset-message");
                document.getElementById("error-message").textContent = "";
                message.textContent = "Invio in corso…";
                message.dataset.error = "false";
                button.disabled = true;
                try {
                    await resetPassword(emailInput.value.trim());
                    message.textContent = "Se l’indirizzo è associato a un account, riceverai un’email per impostare una nuova password. Controlla anche la cartella spam.";
                } catch (error) {
                    message.dataset.error = "true";
                    message.textContent = error.message;
                } finally {
                    button.disabled = false;
                }
            });

            // 🔹 Gestione login con Google
            const googleLoginButton = document.getElementById("google-login");
            if (googleLoginButton) {
                googleLoginButton.addEventListener("click", () => {
                    console.log("📌 Tentativo di login con Google");
                    loginWithGoogle().catch(error => {
                        document.getElementById("error-message").textContent = `Errore: ${error.message}`;
                    });
                });
            }
        });
    </script>
</body>
</html>
