name: Build and deploy Firebase

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Build site
        run: npm run build

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASARATI_9AAFE }}

      - name: Install Firebase CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm install --global firebase-tools@15.34.0

      - name: Deploy Hosting and Functions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: firebase deploy --non-interactive --only functions,hosting --project asarati-9aafe
